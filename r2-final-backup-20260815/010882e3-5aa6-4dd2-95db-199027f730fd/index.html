</style><style>:root {
  --color-text: #1a1a1a;
  --color-muted: #6b6b6b;
  --color-bg: #ffffff;
  --color-border: #e5e5e5;
  --color-accent: #2563eb;
  --color-info: #0369a1;
  --color-info-bg: #e0f2fe;
  --color-warning: #b45309;
  --color-warning-bg: #fef3c7;
  --color-success: #15803d;
  --color-success-bg: #dcfce7;
  --color-note: #6b7280;
  --color-note-bg: #f3f4f6;
  --color-blank-correct-bg: #dcfce7;
  --color-blank-correct-border: #22c55e;
  --color-blank-incorrect-bg: #fee2e2;
  --color-blank-incorrect-border: #ef4444;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-math: "Latin Modern Math", "Cambria Math", serif;
  --max-width: 760px;
}

* { box-sizing: border-box; }

/* Activity-wide typography seam (meta.typography). The renderer emits a
   per-document <style> setting --activity-font-family / --activity-font-size
   on :root (typography.ts); documents without typography set neither, and the
   fallbacks below keep today's look. Family sits on body (not the container)
   so floating UI outside <main> — the hint popover, the calculator — matches
   the activity. The base SIZE sits on the container: content text inherits
   and the em-relative headings scale off it, while the @media print rule
   further down re-takes the container font-size via --print-font-size, so
   meta.print.fontSize keeps sole ownership of print body sizing. A future
   per-span textStyle mark layers over this with span-level inline styles —
   the cascade already resolves in its favor, nothing here changes. */
body {
  font-family: var(--activity-font-family, var(--font-body));
  color: var(--color-text);
  background: var(--color-bg);
  line-height: 1.6;
  margin: 0;
  padding: 1rem;
}

.activity-container {
  max-width: var(--max-width);
  margin: 0 auto;
  font-size: var(--activity-font-size, 1rem);
}

.activity-header {
  border-bottom: 2px solid var(--color-border);
  padding-bottom: 1rem;
  margin-bottom: 2rem;
}

/* Headings and section titles are em-relative (not rem) so they scale off the
   active base size — --activity-font-size on screen, --print-font-size on
   paper. Their margins stay in rem on purpose: vertical rhythm is a layout
   concern, not a type-scale one. */
.activity-header h1 {
  margin: 0 0 0.5rem 0;
  font-size: 1.75em;
}

.activity-header .meta {
  color: var(--color-muted);
  font-size: 0.875rem;
}

.identity-prompt {
  background: var(--color-info-bg);
  border: 1px solid var(--color-info);
  border-radius: 6px;
  padding: 0.75rem 1rem;
  margin: 1rem 0 2rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
}

.identity-prompt label {
  font-weight: 600;
  color: var(--color-info);
}

.identity-prompt input {
  flex: 1 1 200px;
  padding: 0.4rem 0.6rem;
  border: 1px solid var(--color-border);
  border-radius: 4px;
  font-size: 1rem;
}

.activity-section {
  margin-bottom: 2rem;
}

.section-title {
  font-size: 1.25em;
  margin: 1.5rem 0 1rem;
  color: var(--color-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
}

.block { margin: 1rem 0; }

.block-paragraph { margin: 0.75rem 0; }

.block-heading-1 { font-size: 1.5em;  margin: 1.5rem 0 0.75rem; }
.block-heading-2 { font-size: 1.25em; margin: 1.25rem 0 0.5rem; }
.block-heading-3 { font-size: 1.1em;  margin: 1rem 0 0.5rem; font-weight: 600; }

.block-math {
  margin: 1.25rem 0;
  text-align: center;
  overflow-x: auto;
}
/* A gap-bearing equation is a numbered problem: the number gutter sits left of
 the equation (numbering/label decouple). A prompt-free display equation keeps
 the centered layout above. */
.block-math.has-math-prompts.is-numbered {
  display: grid;
  grid-template-columns: 2rem 1fr;
  gap: 0.25rem;
  align-items: baseline;
  text-align: left;
  overflow-x: visible;
}
.block-math__body {
  text-align: center;
  overflow-x: auto;
}

.block-image {
  margin: 1.5rem 0;
  text-align: center;
}
.block-image img {
  max-width: 100%;
  height: auto;
  border-radius: 4px;
}
/* A sized image fills its authored width — the author's dial is authoritative
 (a small source image upscales rather than silently ignoring the setting).
 Unsized images keep their natural size, as before. */
.block-image.block-sized img {
  width: 100%;
}
/* Crop (reframe): an INNER window (.block-image-window) is the fixed-aspect box
 (aspect-ratio set inline per crop) that clips the absolutely-scaled <img>
 (width/height/left/top set inline) so the crop rectangle fills it. The window —
 not the figure — carries overflow:hidden, so the <figcaption> (a figure sibling
 of the window) is NOT clipped (overflow:hidden makes the window a scroll
 container with min-height 0, which would cut off any caption inside it).
 max-width:none lifts the base 100% cap so the scaled source (e.g. 200%) isn't
 clamped. sizing (--block-width) stays on the figure; the window fills it.
 Design: docs/design/image-crop.md. */
.block-image-window {
  position: relative;
  display: block;
  overflow: hidden;
  width: 100%;
}
.block-image-window > img {
  position: absolute;
  max-width: none;
  border-radius: 0;
}
.block-image-caption {
  color: var(--color-muted);
  font-size: 0.875rem;
  margin-top: 0.5rem;
  font-style: italic;
}

.block-callout {
  display: flex;
  gap: 0.75rem;
  padding: 0.85rem 1rem;
  border-radius: 6px;
  border-left: 4px solid;
  margin: 1.25rem 0;
}
.block-callout-icon { font-size: 1.25rem; line-height: 1; }
.block-callout-body > :first-child { margin-top: 0; }
.block-callout-body > :last-child { margin-bottom: 0; }

.block-callout-info    { background: var(--color-info-bg);    border-color: var(--color-info);    }
.block-callout-warning { background: var(--color-warning-bg); border-color: var(--color-warning); }
.block-callout-success { background: var(--color-success-bg); border-color: var(--color-success); }
.block-callout-note    { background: var(--color-note-bg);    border-color: var(--color-note);    }

/* Learning objectives — a titled goals list fronting an activity/section.
   Pure content: quiet card, a full hairline + leading type icon (not a colored
   left-stripe) so it reads as a scaffold not a question and survives grayscale. */
.block-learning-objectives {
  margin: 1.25rem 0;
  padding: 0.85rem 1.1rem;
  border-radius: 6px;
  border: 1px solid var(--color-accent);
  background: var(--color-note-bg);
}
.block-learning-objectives__title {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  margin: 0 0 0.5rem;
  font-weight: 600;
  font-size: 0.95rem;
  letter-spacing: 0.01em;
  color: var(--color-text);
}
.block-learning-objectives__icon {
  font-size: 1rem;
  line-height: 1;
  color: var(--color-accent);
}
.block-learning-objectives__list {
  margin: 0;
  padding-left: 1.25rem;
}
.block-learning-objectives__item { margin: 0.2rem 0; }

/* Worked example — a boxed, fully-worked solution to study. A framed card so it
   reads as "read this," distinct from a problem to attempt — a full accent
   hairline + leading icon (matching learning objectives), not a top-stripe.
   Nested content blocks render inside the body via the shared block dispatch. */
.block-worked-example {
  margin: 1.25rem 0;
  padding: 0.85rem 1.1rem 0.95rem;
  border: 1px solid var(--color-accent);
  border-radius: 6px;
  background: var(--color-note-bg);
}
.block-worked-example__title {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  margin: 0 0 0.6rem;
  font-weight: 600;
  font-size: 0.95rem;
  letter-spacing: 0.01em;
  color: var(--color-text);
}
.block-worked-example__icon { font-size: 1rem; line-height: 1; color: var(--color-accent); }
.block-worked-example__body > .block:first-child { margin-top: 0; }
.block-worked-example__body > .block:last-child { margin-bottom: 0; }

/* Graph figure — a static coordinate-plane picture (reference-panel content;
   the standalone sibling of .mc-choice-figure). Kit-free inline SVG from
   graph-svg.ts, so it prints in grayscale as-is. Wider cap than a choice
   figure (16rem vs 11rem): here the figure is the content, not an annotation
   on a choice row. */
.block-graph-figure {
  margin: 0.75rem 0;
  max-width: 16rem;
}
.block-graph-figure .graph-paper {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 4px;
}

/* Faded worked example — a scaffold: shown steps + fill-in-blank (faded) steps
   the student completes. A dashed frame distinguishes it from the solid
   worked-example box (study vs. do), and survives grayscale print. */
.block-faded-example {
  margin: 1.25rem 0;
  padding: 0.85rem 1.1rem 0.95rem;
  border: 1px dashed var(--color-accent);
  border-radius: 6px;
  background: var(--color-bg);
}
.block-faded-example__title {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  margin: 0 0 0.6rem;
  font-weight: 600;
  font-size: 0.95rem;
  letter-spacing: 0.01em;
  color: var(--color-accent);
}
.block-faded-example__icon { font-size: 1rem; line-height: 1; }
/* Box problem number, leading the title ("3. ✍ Guided practice"). */
.block-faded-example__number { font-weight: 700; }
.block-faded-example__body > .block:first-child { margin-top: 0; }
.block-faded-example__body > .block:last-child { margin-bottom: 0; }
/* A faded step is NOT a standalone problem: it drops the 2.5rem number gutter
   entirely (the box owns the one problem number) and becomes a plain block so
   its body spans the full width the student writes in. The step letter runs
   inline in front of the body — a compact "(a)" that costs almost no horizontal
   room. Tighter vertical rhythm than standalone problems, since these are parts
   of one example, not separate questions. Applies to screen and print. */
.block-faded-example .block-fill-in-blank.is-faded-step {
  display: block;
  margin: 0.5rem 0;
}
.block-faded-step__label {
  font-weight: 600;
  color: var(--color-accent);
  margin-right: 0.15rem;
}

/* Free-text blocks — self_explanation (ungraded), short_answer + essay (manually
   graded). All share the .free-text-input textarea; the runtime captures them by
   that class. */
.block-self-explanation,
.block-free-response { margin: 1.25rem 0; }
.block-self-explanation__prompt,
.block-free-response__prompt { margin-bottom: 0.5rem; }
.free-text-input {
  display: block;
  width: 100%;
  box-sizing: border-box;
  min-height: 5rem;
  padding: 0.5rem 0.65rem;
  font: inherit;
  color: var(--color-text);
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: 6px;
  resize: vertical;
}
.free-text-input:focus {
  outline: 2px solid var(--color-accent);
  outline-offset: 1px;
  border-color: var(--color-accent);
}

/* Essay live word counter — the runtime fills its text on init + input and
   toggles .in-range / .out-of-range when a target is set. */
.free-text-wordcount {
  margin-top: 0.35rem;
  font-size: 0.85rem;
  color: var(--color-muted);
  text-align: right;
}
.free-text-wordcount.in-range { color: var(--color-success); }
.free-text-wordcount.out-of-range { color: var(--color-warning); }

/* Manual-feedback panel (Phase 2.6) — filled + revealed by the get-feedback
   sidecar once a teacher has graded this block. Hidden until then. */
.free-text-feedback__panel {
  margin-top: 0.6rem;
  padding: 0.6rem 0.8rem;
  border-left: 3px solid var(--color-accent);
  border-radius: 6px;
  background: var(--color-note-bg);
}
.free-text-feedback__heading {
  margin: 0 0 0.4rem;
  font-weight: 600;
  font-size: 0.85rem;
  letter-spacing: 0.01em;
  color: var(--color-accent);
}
.free-text-feedback__criterion {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0.25rem 0.75rem;
  padding: 0.3rem 0;
  border-top: 1px solid var(--color-border);
}
.free-text-feedback__criterion:first-of-type { border-top: none; }
.free-text-feedback__criterion-label { font-weight: 500; }
.free-text-feedback__criterion-score {
  font-variant-numeric: tabular-nums;
  color: var(--color-muted);
  white-space: nowrap;
}
.free-text-feedback__criterion-fb {
  grid-column: 1 / -1;
  margin: 0.1rem 0 0;
  font-size: 0.9rem;
  color: var(--color-text);
}
.free-text-feedback__general {
  margin: 0.5rem 0 0;
  padding-top: 0.4rem;
  border-top: 1px solid var(--color-border);
  font-size: 0.9rem;
}

.block-problem,
.block-fill-in-blank {
  display: grid;
  grid-template-columns: 2.5rem 1fr;
  gap: 0.5rem;
  margin: 1.25rem 0;
  align-items: start;
}
/* Interactive graph block — same two-column problem grid as fill-in-blank
 (number gutter + body). The canvas is a square, focusable coordinate plane the
 lazy-loaded graph kit mounts JSXGraph into; touch-action:none hands drag
 gestures to the kit rather than scrolling the page. */
.block-interactive-graph {
  display: grid;
  grid-template-columns: 2.5rem 1fr;
  gap: 0.5rem;
  margin: 1.25rem 0;
  align-items: start;
}
/* Multiple-choice block — same two-column problem grid as fill-in-blank. */
.block-multiple-choice {
  display: grid;
  grid-template-columns: 2.5rem 1fr;
  gap: 0.5rem;
  margin: 1.25rem 0;
  align-items: start;
}
.mc-prompt { margin-bottom: 0.5rem; }
.mc-prompt > :first-child { margin-top: 0; }
.mc-prompt > :last-child { margin-bottom: 0; }
.mc-multi-hint {
  font-size: 0.85rem;
  color: #64748b;
  margin-bottom: 0.35rem;
}
.mc-choices {
  border: none;
  margin: 0;
  padding: 0;
}
.mc-choice {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  padding: 0.3rem 0.5rem;
  border-radius: 6px;
  cursor: pointer;
}
.mc-choice:hover { background: #f1f5f9; }
.mc-choice input {
  cursor: pointer;
  /* Baseline-align the control with the first text line. */
  transform: translateY(0.1em);
}
.mc-choice-letter {
  font-weight: 600;
  color: #64748b;
  min-width: 1.1rem;
}
/* Post-check result classes (toggled by the runtime on the label). */
.mc-choice.correct { background: var(--color-success-bg, #ecfdf5); }
.mc-choice.incorrect { background: #fef2f2; }
.mc-choice.correct .mc-choice-letter { color: var(--color-success, #059669); }
.mc-choice.incorrect .mc-choice-letter { color: #dc2626; }
/* Per-choice feedback, revealed post-check for selected choices. Indented to
 sit under its choice's content. */
.mc-choice-feedback {
  margin: 0.1rem 0 0.45rem 2.6rem;
  padding: 0.4rem 0.65rem;
  font-size: 0.9rem;
  border-left: 3px solid #f59e0b;
  background: #fffbeb;
  border-radius: 0 6px 6px 0;
}
/* Optional per-choice figure (image and/or static graph SVG), stacked below
 the choice text inside the label — clicking the figure selects the choice.
 The 11rem cap matches the graph block's minimum usable board width. */
.mc-choice-figure {
  display: block;
  margin-top: 0.35rem;
  max-width: 11rem;
}
.mc-choice-figure img,
.mc-choice-figure .graph-paper {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 4px;
}
.mc-choice-figure img { border: 1px solid #e2e8f0; }
/* Two or more figured choices switch to the classic 2-up "which graph
 shows…" textbook grid (emitted as .mc-choices-grid by the renderer). Cells
 top-align; a revealed feedback div spans the full row so it never becomes a
 stray grid cell. Collapses back to one column on narrow screens. */
.mc-choices-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.25rem 1rem;
  align-items: start;
}
.mc-choices-grid .mc-choice-figure { max-width: 100%; }
/* In grid cells the figure dominates the label; baseline alignment would sink
 the input + letter to the figure's bottom edge. Pin them to the top instead. */
.mc-choices-grid .mc-choice { align-items: flex-start; }
.mc-choices-grid .mc-choice-feedback { grid-column: 1 / -1; }
@media (max-width: 40rem) {
  .mc-choices-grid { grid-template-columns: minmax(0, 1fr); }
}

/* Matching block — same two-column problem grid as fill-in-blank. Items on
 the left each carry a dashed dock (.match-slot); the lettered target cards on
 the right are dragged into the docks (pointer drag with a keyboard
 select-then-place grammar underneath — runtime/matches.ts). */
.block-matching {
  display: grid;
  grid-template-columns: 2.5rem 1fr;
  gap: 0.5rem;
  margin: 1.25rem 0;
  align-items: start;
}
.match-prompt { margin-bottom: 0.5rem; }
.match-prompt > :first-child { margin-top: 0; }
.match-prompt > :last-child { margin-bottom: 0; }
.match-reuse-hint {
  font-size: 0.85rem;
  color: #64748b;
  margin-bottom: 0.35rem;
}
.match-columns {
  display: grid;
  grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
  gap: 0.5rem 1.25rem;
  align-items: start;
}
@media (max-width: 40rem) {
  .match-columns { grid-template-columns: minmax(0, 1fr); }
}
.match-items,
.match-targets {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}
.match-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.3rem 0.5rem;
  border-radius: 6px;
}
.match-item-content { flex: 1 1 auto; min-width: 0; }
/* The dock. Runtime render() parks a target card inside; drag-over highlight
 and the docked state are runtime-toggled classes. */
.match-slot {
  flex: 0 0 auto;
  min-width: 5.5rem;
  min-height: 2.1rem;
  border: 1.5px dashed #cbd5e1;
  border-radius: 6px;
  display: flex;
  align-items: stretch;
}
.match-slot.drag-over { border-color: #2563eb; background: #eff6ff; }
.match-slot .match-target { flex: 1 1 auto; }
/* Target cards: grabbable. touch-action none hands the gesture to the
 runtime's pointer-drag instead of scrolling the page (the graph canvas
 precedent). */
.match-target {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  padding: 0.35rem 0.6rem;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  background: #fff;
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.match-target:focus-visible,
.order-item:focus-visible {
  outline: 2px solid #2563eb;
  outline-offset: 2px;
}
/* Runtime drag/keyboard-lift states (shared grammar, both blocks). */
.match-target.dragging,
.order-item.dragging {
  opacity: 0.85;
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25);
  cursor: grabbing;
  position: relative;
  z-index: 10;
}
.match-target.lifted,
.order-item.lifted {
  outline: 2px dashed #2563eb;
  outline-offset: 2px;
}
.match-target-letter {
  font-weight: 600;
  color: #64748b;
  min-width: 1.1rem;
}
.match-target-content { min-width: 0; }
/* Ghost letter left behind in an emptied right-column slot, so the bank's
 letters stay put while the card is docked on an item. */
.match-slot-ghost { display: none; }
.match-target-slot.is-empty .match-slot-ghost {
  display: flex;
  align-items: center;
  min-height: 2.1rem;
  padding: 0 0.6rem;
  border: 1.5px dashed #e2e8f0;
  border-radius: 6px;
  color: #94a3b8;
  font-weight: 600;
}
/* Post-check per-pair result classes (toggled by the runtime on the item). */
.match-item.correct { background: var(--color-success-bg, #ecfdf5); }
.match-item.incorrect { background: #fef2f2; }
/* Optional per-item/target figure — same treatment as .mc-choice-figure. */
.match-figure {
  display: block;
  margin-top: 0.35rem;
  max-width: 11rem;
}
.match-figure img,
.match-figure .graph-paper {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 4px;
}
.match-figure img { border: 1px solid #e2e8f0; }
/* Write-the-letter line — print-only (see the print block). */
.match-letter-line { display: none; }

/* Ordering block — same two-column problem grid as fill-in-blank. The list
 renders publish-time shuffled; students drag rows into sequence
 (runtime/orderings.ts). */
.block-ordering {
  display: grid;
  grid-template-columns: 2.5rem 1fr;
  gap: 0.5rem;
  margin: 1.25rem 0;
  align-items: start;
}
.order-prompt { margin-bottom: 0.5rem; }
.order-prompt > :first-child { margin-top: 0; }
.order-prompt > :last-child { margin-bottom: 0; }
.order-list {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}
.order-item {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  padding: 0.35rem 0.6rem;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  background: #fff;
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.order-item-grip { color: #94a3b8; }
.order-item-content { min-width: 0; }
/* Drop-position gap the runtime opens while a row is dragged over the list. */
.order-item.drop-before { margin-top: 1.4rem; }
.order-item.drop-after { margin-bottom: 1.4rem; }
/* Post-check per-position result classes (block SCORE stays all-or-nothing;
 the per-row verdicts are feedback, like per-blank verdicts). */
.order-item.correct { background: var(--color-success-bg, #ecfdf5); border-color: #a7f3d0; }
.order-item.incorrect { background: #fef2f2; border-color: #fecaca; }
/* Write-in sequence-number box — print-only (see the print block). */
.order-number-box { display: none; }
/* Visually-hidden live region for drag/keyboard narration (matching +
 ordering). Standard clip-rect screen-reader-only recipe. */
.sr-status {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
/* Reuse-mode docked COPY of a target card (runtime-built; the original card
 stays in the bank). Click/tap removes the pairing. */
.match-docked-chip { cursor: pointer; }
.match-docked-chip:hover { border-color: #dc2626; }

/* The display (static-figure) variant emits no problem number, so the numbered
 grid would auto-place its single body child into the 2.5rem gutter track and
 crush the canvas to 40px. No gutter → no grid. */
.block-graph-display {
  display: block;
}
.graph-prompt { margin-bottom: 0.5rem; }
.graph-prompt > :first-child { margin-top: 0; }
.graph-prompt > :last-child { margin-bottom: 0; }
.graph-canvas {
  position: relative;
  width: 100%;
  max-width: 28rem;
  aspect-ratio: 1 / 1;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  background: #fff;
  touch-action: none;
}
.graph-canvas:focus-visible {
  outline: 2px solid #2563eb;
  outline-offset: 2px;
}
/* Graph in a column cell (Drop 1). A cell has min-width:0 so its grid track can
 shrink below content — without a floor, a graph in a 3+-column layout crushes
 to unusable. Keep a minimum rendered board and let the graph block scroll
 horizontally inside the cell instead (the block is content-height, so the
 forced overflow-y never clips vertically; a too-narrow cell scrolls rather than
 squashing the board). Screen only — print/foldable have no scroll, so on paper
 the board keeps its pure responsive shrink and never overflows the page. */
@media screen {
  .column-cell .block-interactive-graph { overflow-x: auto; }
  .column-cell .graph-canvas { min-width: 11rem; }
}
/* The static fallback SVG (graph-svg.ts) — the pre-hydration canvas content
 (blank plane on graded blocks, the full figure on display blocks). Fills the
 square canvas; the kit clears it when the interactive board mounts. */
.graph-canvas > .graph-paper {
  display: block;
  width: 100%;
  height: 100%;
}
/* Screen-only cue for the no-JS / kit-failed case, overlaid at the bottom of
 the fallback grid (the canvas is position:relative). Hidden in print — paper
 gets the bare grid. */
.graph-nojs {
  position: absolute;
  left: 50%;
  bottom: 0.4rem;
  transform: translateX(-50%);
  margin: 0;
  padding: 0.15rem 0.6rem;
  max-width: 92%;
  text-align: center;
  color: #64748b;
  font-size: 0.8rem;
  background: rgba(255, 255, 255, 0.85);
  border-radius: 4px;
}
.js-graph-feedback {
  margin-top: 0.5rem;
  font-size: 0.9rem;
}
.js-graph-feedback[data-state="correct"] { color: #15803d; }
.js-graph-feedback[data-state="incorrect"] { color: #b91c1c; }
/* Position narration (data-mode="narrate") is for SCREEN READERS ONLY — a
 visible live coordinate readout would hand a sighted student the answer to
 any "plot the point" question (reading the grid is the skill). Standard
 visually-hidden treatment: rendered, in the a11y tree, announced via
 aria-live, but invisible. Post-check results (data-mode="result") stay
 visible. */
.js-graph-feedback[data-mode="narrate"] {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  clip-path: inset(50%);
  overflow: hidden;
  white-space: nowrap;
}

/* ---- number_line block (1-D) — mirrors the graph block, wide + short ------- */
.number-line-prompt { margin-bottom: 0.5rem; }
.number-line-prompt > :first-child { margin-top: 0; }
.number-line-prompt > :last-child { margin-bottom: 0; }
.number-line-canvas {
  position: relative;
  width: 100%;
  max-width: 34rem;
  aspect-ratio: 500 / 90;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  background: #fff;
  touch-action: none;
}
.number-line-canvas:focus-visible {
  outline: 2px solid #2563eb;
  outline-offset: 2px;
}
/* In a column cell: keep a legible floor and scroll horizontally rather than
 crushing the line (same treatment as the graph block). Screen only. */
@media screen {
  .column-cell .block-number-line { overflow-x: auto; }
  .column-cell .number-line-canvas { min-width: 15rem; }
}
.number-line-canvas > .number-line-paper {
  display: block;
  width: 100%;
  height: 100%;
}
.number-line-nojs {
  position: absolute;
  left: 50%;
  bottom: 0.2rem;
  transform: translateX(-50%);
  margin: 0;
  padding: 0.15rem 0.6rem;
  max-width: 92%;
  text-align: center;
  color: #64748b;
  font-size: 0.8rem;
  background: rgba(255, 255, 255, 0.85);
  border-radius: 4px;
}
.js-numberline-feedback {
  margin-top: 0.5rem;
  font-size: 0.9rem;
}
.js-numberline-feedback[data-state="correct"] { color: #15803d; }
.js-numberline-feedback[data-state="incorrect"] { color: #b91c1c; }
/* Position narration is SCREEN-READER-ONLY — a visible value readout would hand
 the answer to any "mark the point" question. Same visually-hidden treatment as
 the graph feedback; post-check results (data-mode="result") stay visible. */
.js-numberline-feedback[data-mode="narrate"] {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  clip-path: inset(50%);
  overflow: hidden;
  white-space: nowrap;
}
/* ---- data_plot block (statistics charts) — mirrors the number-line block --- */
.data-plot-canvas {
  position: relative;
  width: 100%;
  max-width: 34rem;
  aspect-ratio: 500 / 200;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  background: #fff;
  touch-action: none;
}
.data-plot-canvas:focus-visible {
  outline: 2px solid #2563eb;
  outline-offset: 2px;
}
/* A display (static) chart is not interactive: no focus box, no fixed height —
 the SVG sets its own aspect ratio and the figure sizes to it. */
.data-plot-static {
  border: none;
  aspect-ratio: auto;
  touch-action: auto;
}
@media screen {
  .column-cell .block-data-plot { overflow-x: auto; }
  .column-cell .data-plot-canvas { min-width: 15rem; }
}
.data-plot-canvas > .data-plot-paper {
  display: block;
  width: 100%;
  height: 100%;
}
.data-plot-static > .data-plot-paper { height: auto; }
.data-plot-source {
  margin: 0 0 0.4rem;
  font-size: 0.95rem;
}
.data-plot-caption {
  margin-bottom: 0.4rem;
}
.data-plot-nojs {
  position: absolute;
  left: 50%;
  bottom: 0.2rem;
  transform: translateX(-50%);
  margin: 0;
  padding: 0.15rem 0.6rem;
  max-width: 92%;
  text-align: center;
  color: #64748b;
  font-size: 0.8rem;
  background: rgba(255, 255, 255, 0.85);
  border-radius: 4px;
}
.js-dataplot-feedback {
  margin-top: 0.5rem;
  font-size: 0.9rem;
}
.js-dataplot-feedback[data-state="correct"] { color: #15803d; }
.js-dataplot-feedback[data-state="incorrect"] { color: #b91c1c; }
.js-dataplot-feedback[data-mode="narrate"] {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  clip-path: inset(50%);
  overflow: hidden;
  white-space: nowrap;
}

.block-bullet-list,
.block-ordered-list {
  padding-left: 1.5rem;
}
.block-bullet-list li,
.block-ordered-list li {
  margin: 0.25rem 0;
}
/* Nested lists sit tighter than the .block 1rem default. */
.block-bullet-list .block-bullet-list,
.block-bullet-list .block-ordered-list,
.block-ordered-list .block-bullet-list,
.block-ordered-list .block-ordered-list {
  margin: 0.25rem 0;
}
.block-problem-number {
  font-weight: 600;
  text-align: right;
  padding-right: 0.25rem;
}
/* A custom label ("Warm-up", "Challenge") reads as a tag, not a count. A none
 label emits no gutter at all, so there is nothing to hide. (numbering/label decouple) */
.block-problem-number--custom {
  font-weight: 500;
  font-style: italic;
}
/* Sub-part letter before a gap on a numbered multi-blank problem: "(a) ___ (b) ___".
 A compact, muted marker so it reads as a label, not part of the sentence. */
.blank-sublabel {
  font-weight: 600;
  margin-right: 0.15rem;
  white-space: nowrap;
}
.block-problem-body > :first-child { margin-top: 0; }
.block-problem-body > :last-child { margin-bottom: 0; }

/* Structural rows (rows-of-columns layout). The grid track sizing comes from --columns-template
 (set inline by the renderer from per-column width weights); the fallback keeps
 a config-less context (e.g. a stray clone) sane. min-width:0 on each cell lets
 the grid track shrink so wide content (long math, pre, images) can't blow the
 track out. The container lays out side by side everywhere — print and the
 foldable inherit this rule unconditionally; only @media screen narrows it. */
.block-row {
  display: grid;
  grid-template-columns: var(--columns-template, 1fr 1fr);
  gap: 1.5rem;
  align-items: start;
  margin: 1rem 0;
}
.block-row > .column-cell {
  min-width: 0;
  /* Reserved work space (Column.minHeight): the renderer sets
   --cell-min-height inline only when authored, so the fallback keeps every
   other cell content-sized. A floor, not a fixed height — the cell still
   grows, so print pagination and foldable measurement stay honest. Applies
   in every output: on paper this IS the write-in work space. */
  min-height: var(--cell-min-height, auto);
}
.block-row > .column-cell > :first-child { margin-top: 0; }
.block-row > .column-cell > :last-child { margin-bottom: 0; }

/* Ruled grid (gridLines). The renderer emits data-grid-lines="true" only when
 the resolved tri-state is on (per-block, or the activity-wide print default).
 It boxes the whole block, draws a vertical rule between cells, and a horizontal
 rule between the stacked blocks inside a cell — boxed regions to write in or cut
 out on paper. The gap collapses to 0 so a single hairline (the border layer)
 sits between regions instead of empty space; cells get their own padding back.
 Renders in every output (screen, print, foldable), like the columns themselves. */
.block-row[data-grid-lines="true"] {
  gap: 0;
  border: 1px solid #94a3b8;
  /* Override the unruled default (align-items:start). Ruled cells must stretch
   to the row's full height so the between-cell divider (a border-left) spans
   the whole box — otherwise a short or empty cell yields a stub divider that
   stops where its own content ends. Stretch also gives equal-height boxed
   regions, which is the point of a ruled grid on paper. */
  align-items: stretch;
}
.block-row[data-grid-lines="true"] > .column-cell {
  padding: 0.75rem;
  border-left: 1px solid #94a3b8;
}
.block-row[data-grid-lines="true"] > .column-cell:first-child {
  border-left: none;
}
/* Horizontal rule between stacked blocks in a cell. Zero the block's own
 top-margin and use symmetric padding so the rule sits centered in even space,
 not doubled against a block margin. :first-child stays flush (rule is between
 blocks, not above the first). */
.block-row[data-grid-lines="true"] > .column-cell > * + * {
  margin-top: 0.75rem;
  padding-top: 0.75rem;
  border-top: 1px solid #cbd5e1;
}

/* Per-block sizing (width fraction + align). The renderer adds .block-sized
 plus an inline --block-width custom property; consuming the property HERE
 (instead of an inline width) lets the narrow-screen rule below relax it.
 Auto horizontal margins center by default; align attrs zero one side. Only
 the horizontal margins are touched, so each block type keeps its own
 vertical rhythm. The sized block stays in normal flow — no wrap-around — by
 design (reflow safety; see docs/design/variable-block-sizing.md). */
.block-sized {
  width: var(--block-width, 100%);
  margin-left: auto;
  margin-right: auto;
}
.block-sized[data-block-align="left"]  { margin-left: 0; }
.block-sized[data-block-align="right"] { margin-right: 0; }
/* A sized figure block's authored width is authoritative — lift the board's
 default max-width cap (28rem/34rem, which keeps an UNSIZED board at a sensible
 size) so the --block-width fraction fully drives the canvas, mirroring images
 (.block-image.block-sized img). Without this the cap silently swallows the
 setting for any fraction that still exceeds the cap. Applies on screen AND
 print (where footprint control is the whole point). */
.block-sized .graph-canvas,
.block-sized .number-line-canvas,
.block-sized .data-plot-canvas {
  max-width: none;
}

/* Narrow screens only: collapse to a single column so a 2-/3-column layout
 stays readable on a phone. Scoped to @media SCREEN so it never reaches paper
 or the foldable (both print-media), where columns must stay side by side. */
@media screen and (max-width: 640px) {
  .block-row { grid-template-columns: 1fr; }
  /* Authored block widths relax to full on a phone (a 33%-wide figure in a
   ~360px viewport is unusable) — paper and the foldable keep them. */
  .block-sized { width: 100%; }
  /* Stacked: the between-cell rule flips from a left border to a top border so
   the grid still reads as separated regions when columns sit on top of
   each other. */
  .block-row[data-grid-lines="true"] > .column-cell {
    border-left: none;
    border-top: 1px solid #94a3b8;
  }
  .block-row[data-grid-lines="true"] > .column-cell:first-child {
    border-top: none;
  }
}

/* The blank-token wrapper keeps an <input class="blank"> and its sibling
 a fford*ances (.js-blank-hint, .js-blank-mistake) on the same inline-flow
 line, so they can't wrap apart mid-prose. The wrapper is structural only —
 the 'blank' class stays on the <input> itself, so every existing .blank
 selector continues to target the input directly. align-items: baseline lines
 the input baseline up with the surrounding prose; the gap controls spacing
 between input and its buttons. (Hidden siblings have display: none via the
'hidden' attribute and don't participate in the gap.) */
.blank-wrapper {
  display: inline-flex;
  align-items: baseline;
  gap: 0.25rem;
}

.blank {
  display: inline-block;
  width: var(--blank-width, 6ch);
  padding: 0.15rem 0.4rem;
  border: 1px solid var(--color-border);
  border-bottom: 2px solid var(--color-text);
  border-radius: 3px;
  font-family: inherit;
  font-size: inherit;
  background: #fafafa;
  text-align: center;
}
.blank:focus {
  outline: 2px solid var(--color-accent);
  outline-offset: 1px;
  background: white;
}
.blank.correct {
  background: var(--color-blank-correct-bg);
  border-color: var(--color-blank-correct-border);
}
.blank.incorrect {
  background: var(--color-blank-incorrect-bg);
  border-color: var(--color-blank-incorrect-border);
}

/* Hint affordance. The .js-blank-hint button is always available next to
 t he bl*ank when the teacher authored a hint; clicking it opens the global
 hint modal (.js-hint-modal) where the runtime shows the hint text. The
 button is a small circular '?' icon — discoverable without dominating the
 line. */
.js-blank-hint {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.25rem;
  height: 1.25rem;
  padding: 0;
  border: 1px solid var(--color-border);
  border-radius: 50%;
  background: white;
  color: var(--color-muted);
  font-family: inherit;
  font-size: 0.75rem;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
}
.js-blank-hint:hover {
  color: var(--color-text);
  border-color: var(--color-text);
}
.js-blank-hint:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 1px;
}

/* Mistake affordance. The red .js-blank-mistake '!' button mirrors the hint
 button's geometry but is emitted 'hidden' — the runtime reveals it only when
 a wrong answer matches an authored mistake-feedback entry, and clicking it
 opens the shared popover with that feedback. Red signals "something's off
 here" without being as heavy as inline error text. The explicit
 [hidden] { display: none } overrides the inline-flex display so the button
 truly disappears (and leaves no gap) until revealed. */
.js-blank-mistake {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.25rem;
  height: 1.25rem;
  padding: 0;
  border: 1px solid var(--color-blank-incorrect-border);
  border-radius: 50%;
  background: white;
  color: var(--color-blank-incorrect-border);
  font-family: inherit;
  font-size: 0.8rem;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
}
.js-blank-mistake[hidden] {
  display: none;
}
.js-blank-mistake:hover {
  background: var(--color-blank-incorrect-border);
  color: white;
}
.js-blank-mistake:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 1px;
}

/* Shared floating popover (document.ts) for hints and mistake feedback. A
 single bare panel anchored beside the trigger button that opened it. Unlike
 the old modal it does NOT dim the page or trap the viewport: position:fixed
 with explicit left/top (set by the runtime) instead of a full-screen overlay,
 so the rest of the activity stays interactive while it's open. The runtime
 seeds left/top beside the trigger and updates them as the student drags the
 header. z-index sits above all activity content; the panel caps its width for
 readability and scrolls internally if the text is long. */
.js-popover {
  position: fixed;
  z-index: 1000;
  width: min(22rem, calc(100vw - 2rem));
  max-height: 60vh;
  overflow-y: auto;
  background: white;
  border: 1px solid var(--color-border);
  border-radius: 8px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
}
.js-popover[hidden] {
  display: none;
}
/* The header doubles as the drag handle. touch-action:none lets the runtime's
 pointer drag work on touch without the browser hijacking it for scrolling;
 user-select:none stops text selection while dragging. */
.js-popover-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.4rem 0.5rem 0.4rem 0.75rem;
  border-bottom: 1px solid var(--color-border);
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}
.js-popover-header:active {
  cursor: grabbing;
}
.js-popover-title {
  margin: 0;
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--color-text);
}
/* Mistake variant: tint the title red to match the '!' trigger. */
.js-popover[data-kind="mistake"] .js-popover-title {
  color: var(--color-blank-incorrect-border);
}
.js-popover-close {
  flex: none;
  width: 1.75rem;
  height: 1.75rem;
  padding: 0;
  border: none;
  border-radius: 4px;
  background: transparent;
  color: var(--color-muted);
  font-size: 1.25rem;
  line-height: 1;
  cursor: pointer;
}
.js-popover-close:hover {
  background: var(--color-note-bg);
  color: var(--color-text);
}
.js-popover-close:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 1px;
}
.js-popover-body {
  padding: 0.75rem;
  font-size: 0.95rem;
  line-height: 1.5;
  color: var(--color-text);
  white-space: pre-wrap;
}

/* Inline vocabulary definition (the definition mark). A subtle dotted
 underline cues that the term is defined; click / tap / Enter / Space opens a
 small popover with the definition (the definitions sidecar, inlined only on
 pages that have one). Deliberately NOT link-blue — a glossary cue, not a
 hyperlink. The underline is currentColor so it stays ink-safe when printed. */
.definition {
  cursor: help;
  text-decoration: underline dotted currentColor;
  text-underline-offset: 0.15em;
}
.definition:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
  border-radius: 2px;
}

/* The definition popover is created and positioned by the sidecar — its own
 element, independent of the scoring runtime's shared .js-popover. Card styling
 mirrors that popover for visual consistency. */
.definition-popover {
  position: fixed;
  z-index: 1000;
  /* Wider than the original one-line popover: a definition now carries BLOCK
   content (display equations, lists, figures — see
   docs/design/definition-rich-content.md), and a centered equation reads badly
   at 20rem. Still viewport-clamped, and the body owns the scroll. */
  width: min(28rem, calc(100vw - 2rem));
  max-height: 60vh;
  overflow-y: auto;
  background: white;
  border: 1px solid var(--color-border);
  border-radius: 8px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
}
.definition-popover[hidden] {
  display: none;
}
.definition-popover-body {
  padding: 0.6rem 0.75rem;
  font-size: 0.95rem;
  line-height: 1.5;
  color: var(--color-text);
}

/* Definition content renders through the SAME block renderers the body uses, so
 the markup carries page-scale spacing and heading sizes. These rules re-scale
 that content for a popover; they are scoped to .definition-popover-body, so
 nothing here can affect the page. */
.definition-popover-body .block {
  margin: 0.5rem 0;
}
.definition-popover-body .block:first-child {
  margin-top: 0;
}
.definition-popover-body .block:last-child {
  margin-bottom: 0;
}
/* A popover is not a document: a definition's headings are labels within one
 card, so the page's h1/h2/h3 scale would shout. Flatten toward the body size
 while keeping the three levels distinguishable. */
.definition-popover-body .block-heading-1 { font-size: 1.15em; margin: 0.75rem 0 0.25rem; }
.definition-popover-body .block-heading-2 { font-size: 1.05em; margin: 0.75rem 0 0.25rem; }
.definition-popover-body .block-heading-3 { font-size: 1em;    margin: 0.75rem 0 0.25rem; }
/* Display math can overflow a narrow card; let it scroll on its own axis
 rather than widening the popover or clipping. */
.definition-popover-body .block-math {
  overflow-x: auto;
  margin: 0.5rem 0;
}
/* Figures and images cap to the card, never stretch. */
.definition-popover-body .block-image img,
.definition-popover-body .block-graph-figure svg {
  max-width: 100%;
  height: auto;
}
.definition-popover-body .block-image {
  margin: 0.5rem 0;
}
/* A graph figure is capped at 16rem (see .block-graph-figure), narrower than
 the card, so center the BLOCK with auto margins rather than leaving it hanging
 on the left. Centering inside it would do nothing — the box is already the
 figure's width. */
.definition-popover-body .block-graph-figure {
  margin-left: auto;
  margin-right: auto;
}
.definition-popover-body .block-bullet-list,
.definition-popover-body .block-ordered-list {
  margin: 0.5rem 0;
  padding-left: 1.25rem;
}

/* Confidence rating fieldset (Stage 12 step 3). One per fill-in-blank
 b lock *when hasConfidenceRating is true. Sits inside the problem body
 so it aligns under the problem number with the rest of the body
 content. Default browser fieldset styling is heavy; we tone it down
 to a thin bordered container with a small muted legend. Radios use
 plain inline-block layout (vs inline-flex) — simpler whitespace
 handling between input and label text, predictable across browsers. */
.js-confidence-rating {
  margin: 0.75rem 0 0;
  padding: 0.4rem 0.75rem 0.5rem;
  border: 1px solid var(--color-border);
  border-radius: 4px;
}
.js-confidence-rating legend {
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--color-muted);
  padding: 0 0.4rem;
}
.js-confidence-rating label {
  display: inline-block;
  margin-right: 1rem;
  font-size: 0.9rem;
  cursor: pointer;
}
.js-confidence-rating label:last-child {
  margin-right: 0;
}
.js-confidence-rating input[type="radio"] {
  margin-right: 0.25rem;
  cursor: pointer;
  vertical-align: middle;
}

/* Solution slot. Hidden in source HTML; the Stage 13 runtime toggles
 ' hidde*n' when the section is checked. Visual treatment: subtle
 left-accent + tinted background so a revealed solution reads clearly
 as the teacher's explanation rather than continuation of the
 problem prose. */
.js-solution {
  margin-top: 0.75rem;
  padding: 0.6rem 0.8rem;
  border-left: 3px solid var(--color-accent);
  background: var(--color-info-bg);
  border-radius: 0 4px 4px 0;
  font-size: 0.95rem;
}

/* Checkpoint controls (Stage 12 step 4). Per-section button + score
 d ispla*y in locked/free submissionMode. Button visual: secondary
 (accent border, white fill) so it doesn't compete with the final
 submit button at the bottom of the page; hover fills it for clear
 affordance. .js-section-score reveals on check with text like
 "4 / 6 correct" — subdued status text inline with the button. */
.js-checkpoint-btn {
  display: inline-block;
  margin-top: 1rem;
  padding: 0.5rem 1.25rem;
  background: white;
  color: var(--color-accent);
  border: 2px solid var(--color-accent);
  border-radius: 6px;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
}
.js-checkpoint-btn:hover:not(:disabled) {
  background: var(--color-accent);
  color: white;
}
.js-checkpoint-btn:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}
.js-checkpoint-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.js-section-score {
  display: inline-block;
  margin-left: 0.75rem;
  font-size: 0.95rem;
  color: var(--color-muted);
  font-weight: 600;
}

.math-error {
  font-family: monospace;
  font-size: 0.85em;
  background: #fff0f0;
  padding: 1px 4px;
  border-radius: 3px;
}

.submit-area {
  border-top: 2px solid var(--color-border);
  padding-top: 1.5rem;
  margin-top: 2.5rem;
  text-align: center;
}
.submit-button {
  background: var(--color-accent);
  color: white;
  border: none;
  border-radius: 6px;
  padding: 0.75rem 2rem;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
}
.submit-button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.submit-button:hover:not(:disabled) {
  background: #1d4ed8;
}
.submit-status {
  margin-top: 0.75rem;
  min-height: 1.5em;
  font-size: 0.95rem;
}
.submit-status.success { color: var(--color-success); }
.submit-status.error   { color: var(--color-warning); }

/* =============================================================================
 Reference panel (scaffold) — optional teacher-authored reference content
 (formula charts, vocab lists, conversion tables…). Rendered OUTSIDE any
 .activity-section so the runtime never walks it. Two presentations of the
 same blocks:
 - screen: .reference-tool, a summon button in the .tool-corner cluster + a
 hidden floating panel (calculator-style window: header drag via the sidecar,
 native CSS resize). The sidecar toggles it; without JS it stays hidden.
 - print: .reference-print, a static box at the top (see @media print).
 ============================================================================= */

/* Floating panel: a fixed window anchored bottom-LEFT by default so an open
 calculator (bottom-right) never collides. The sidecar pins left/top on first
 drag. Inline width/height written by the native resize handle persist across
 close/open — the element is never destroyed, so session geometry is free. */
/* display:flex on the class would silently defeat the hidden attribute (the
 UA's [hidden]{display:none} loses to any authored display) — restate it. */
.reference-float[hidden] { display: none; }
.reference-float {
  position: fixed;
  left: 1rem;
  bottom: 1rem;
  z-index: 115; /* above activity content; below the calculator panel (120) and .js-popover (1000) */
  display: flex;
  flex-direction: column;
  width: 24rem;
  min-width: 14rem;
  min-height: 8rem;
  max-width: calc(100vw - 2rem); /* phone: clamp to the viewport, never overflow */
  max-height: min(70vh, 40rem);
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: 10px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.22);
  /* Native drag-resize (bottom-right handle) — an enhancement, never a
   requirement. Needs overflow != visible; the BODY below owns the scroll. */
  resize: both;
  overflow: hidden;
}
/* Header doubles as the drag handle (the sidecar owns the pointer drag);
 touch-action:none so touch drags aren't swallowed by scrolling. */
.reference-float-header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex: 0 0 auto;
  padding: 0.5rem 0.9rem;
  cursor: move;
  user-select: none;
  touch-action: none;
  border-bottom: 1px solid var(--color-border);
}
.reference-float-header button { cursor: pointer; } /* controls still click */
.reference-float-title {
  flex: 1;
  font-weight: 600;
  color: var(--color-accent);
}
.reference-float-close {
  font-size: 1.25rem;
  line-height: 1;
  border: none;
  background: none;
  color: var(--color-muted, #64748b);
  padding: 0 0.2rem;
}
.reference-float-close:hover { color: inherit; }
/* The body owns the height cap + scroll (the panel keeps overflow:hidden for
 the native resize handle). */
.reference-float-body {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 0.25rem 1rem 1rem;
}

/* Print box hidden on screen; @media print reveals it (and hides the screen
 tool cluster). */
.reference-print { display: none; }

/* Definition glossary appendix — the PAPER surface for inline vocabulary
 definitions, whose popovers are display:none in print. Hidden on screen for the
 mirror-image reason: on screen the popover IS the surface, and repeating every
 definition at the foot of the page would be noise. @media print reveals it.
 Emitted only when meta.print.printDefinitionGlossary is on. */
.definition-glossary { display: none; }

/* =============================================================================
 Tool corner (scaffolds). ONE fixed bottom-right cluster holding the summon
 buttons for the reference panel and the calculator, so both tools coexist
 without overlapping. Each tool's floating panel is position:fixed itself, so
 the cluster only lays out the buttons. Rendered OUTSIDE any .activity-section
 so the runtime never walks it. Hidden in print.
 ============================================================================= */
.tool-corner {
  position: fixed;
  right: 1rem;
  bottom: 1rem;
  z-index: 110; /* above activity content; below the floating panels; below .js-popover (1000) */
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.calculator-summon,
.reference-summon {
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  padding: 0.5rem 0.95rem;
  border: 1px solid var(--color-accent);
  border-radius: 999px;
  background: var(--color-accent);
  color: #fff;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
}
.calculator-summon:hover,
.reference-summon:hover { filter: brightness(0.95); }
.calculator-summon:focus-visible,
.reference-summon:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}
.calculator-summon[aria-busy='true'] { cursor: progress; opacity: 0.7; }

/* Print-only header (Name/Date/… fill-in lines). Hidden on screen — the live
 on-screen name field is .identity-prompt; this is the paper equivalent and is
 revealed (with its child styles) inside @media print below. */
.print-header { display: none; }

/* Print-only hand-markable confidence row. Hidden on screen — the live control
 is the interactive .js-confidence-rating fieldset; this is the paper equivalent
 (checkboxes to tick by pen), revealed inside @media print below. */
.print-confidence { display: none; }

/* =============================================================================
 B aseline* print layer (Stage 11)
 -----------------------------------------------------------------------------
 Goal: a published activity that looks broken on paper today, doesn't.
 This is NOT the print FEATURE (multi-column layout, work space, configured
 header, answer key) — that lives post-Stage-16 (print-and-printables.md).
 Scope of this layer:
 - Maximize printable area: @page margin 0.5in (floor for safe edge across
 unknown classroom printers — most laser printers have ~0.25in hardware
 non-printable margin).
 - Hide interactive controls so students don't print a Submit button.
 - Page-break integrity: never split a problem; let sections flow.
 - Grayscale safety: don't encode meaning in color alone (callouts vary by
 border STYLE; blank correct/incorrect state is neutralized — pre-lesson
 printables are blank worksheets, no scored state to distinguish).
 - Print typography is deliberately unchanged: it's a configurable feature
 (--print-font-size) reserved for the post-Stage-16 print work.
 ============================================================================= */
@media print {
  /* @page (paper size + margin) is emitted PER-DOCUMENT by the renderer
   (printPageStyle in document.ts) — it is configurable (letter/A4 + margin)
   and @page rules can't reliably read CSS custom properties, so it can't be a
   static rule here. */

  body { padding: 0; }

  /* Configured print layout. The renderer sets these --print-* vars on
   .activity-container (printContainerVars); this is where they take effect.
   The var() fallbacks keep a config-less context sane (e.g. the editor
   preview, which renders the body without the container that carries the
   vars). max-width is dropped so single- and multi-column layouts fill the
   page box the @page margins define — the on-screen 760px cap is a
   reading-comfort device with no place on paper, and A4 / multi-column need
   the full width. */
  .activity-container {
    max-width: none;
    font-size: var(--print-font-size, 11pt);
    /* DORMANT worksheet-columns plumbing. The author-facing "Columns" control
       (PrintConfig.columns) was retired when structural authored columns
       landed, but this rule + the --print-columns var are intentionally kept so
       activities saved with columns:2/3 still print multi-column, and so the
       control can be re-exposed with no renderer change. --print-columns is 1
       (a no-op single column) for every new activity. See PrintConfig.columns
       in packages/schema/src/document.ts for the full rationale. */
    column-count: var(--print-columns, 1);
    column-gap: 2rem;
  }

  /* Print-only header: a wrapping row of labeled fill-in lines (Name, Date,
   …) across the top of the sheet, ruled off from the body below. */
  .print-header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.4rem 1.5rem;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid black;
    font-size: 0.95em;
  }
  .print-field {
    display: inline-flex;
    align-items: baseline;
    gap: 0.4rem;
  }
  .print-field-label {
    font-weight: 600;
    white-space: nowrap;
  }
  .print-field-line {
    display: inline-block;
    min-width: 8ch;
    border-bottom: 1px solid black;
  }
  /* Name and free-form custom fields get a longer writing line; the score
   field needs only a short one. */
  .print-field-name .print-field-line,
  .print-field-custom .print-field-line {
    min-width: 14ch;
  }
  .print-field-score .print-field-line {
    min-width: 6ch;
  }

  /* Print-only confidence row: the paper equivalent of the interactive
   fieldset (which is hidden just below). A wrapping row of labeled empty
   boxes the student ticks by hand. */
  .print-confidence {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.3rem 1.25rem;
    margin-top: 0.5rem;
    font-size: 0.9em;
  }
  .print-confidence-label {
    font-weight: 600;
  }
  .print-confidence-option {
    display: inline-flex;
    align-items: baseline;
    gap: 0.35rem;
    white-space: nowrap;
  }
  .print-confidence-box {
    display: inline-block;
    width: 0.85em;
    height: 0.85em;
    border: 1px solid black;
    /* Nudge the box onto the text baseline (inline-block sits on it by its
     bottom edge, which reads as floating high next to the cap height). */
    transform: translateY(0.1em);
  }

  /* Reference box: the screen tool (summon button + floating panel) never
   prints — the .tool-corner hide below covers it; the static box does (when
   the teacher left printReferencePanel on — the renderer omits it otherwise).
   Sits at the top of the worksheet, kept whole across page/column breaks. */
  .reference-print {
    display: block;
    break-inside: avoid;
    border: 1px solid black;
    border-radius: 4px;
    padding: 0.6rem 0.9rem;
    margin-bottom: 1.5rem;
  }
  .reference-print-title {
    font-weight: 700;
    margin-bottom: 0.4rem;
  }

  /* Glossary appendix at the END of the worksheet. Starts on its own page-break
   opportunity so it reads as an appendix rather than trailing the last problem,
   and each entry stays whole. The definition popover stays hidden in print (see
   the interactive-element hide below) — this is its paper replacement. */
  .definition-glossary {
    display: block;
    break-before: auto;
    margin-top: 1.5rem;
    padding-top: 0.75rem;
    border-top: 1px solid black;
  }
  .definition-glossary-title {
    font-size: 1.1em;
    font-weight: 700;
    margin: 0 0 0.5rem;
  }
  .definition-glossary-list {
    margin: 0;
  }
  .definition-glossary-term {
    font-weight: 700;
    break-after: avoid;
  }
  .definition-glossary-body {
    margin: 0 0 0.6rem;
    padding-left: 1rem;
    break-inside: avoid;
  }
  /* Entries carry the same block markup the popover does; re-scale it for a
   paper appendix (the popover rules are scoped to .definition-popover-body and
   never apply here). */
  .definition-glossary-body .block {
    margin: 0.3rem 0;
  }
  .definition-glossary-body .block-heading-1,
  .definition-glossary-body .block-heading-2,
  .definition-glossary-body .block-heading-3 {
    font-size: 1em;
    margin: 0.4rem 0 0.2rem;
  }
  .definition-glossary-body .block-graph-figure {
    margin-left: 0;
  }
  /* Display math is page-centered by default, which in a glossary entry throws
   the equation to the middle of the sheet, visually detached from the term it
   belongs to. Left-align it so it reads as part of the entry. KaTeX re-centers
   twice on its own — on .katex-display AND, more specifically, on
   .katex-display > .katex — so all three need naming to win. */
  .definition-glossary-body .block-math,
  .definition-glossary-body .block-math .katex-display,
  .definition-glossary-body .block-math .katex-display > .katex {
    text-align: left;
  }

  /* Hide interactive elements. The js-* selectors are documented in
   R UNT*IME.md; some not all emitted yet, listed here so the baseline is
   correct the moment those land. Printable hints + solutions are a
   post-Stage-16 print-feature configuration (answer-key variant), not
   a baseline. */
  .identity-prompt,
  .submit-area,
  .js-checkpoint-btn,
  .js-section-score,
  .js-confidence-rating,
  .js-blank-hint,
  .js-blank-mistake,
  .js-popover,
  .definition-popover,
  .tool-corner,
  .js-graph-feedback,
  .graph-nojs,
  .js-numberline-feedback,
  .number-line-nojs,
  .js-solution {
    display: none;
  }

  /* Interactive graph on paper: no JSXGraph runs, so what prints is the
   static fallback SVG (graph-svg.ts) — a real coordinate grid the student
   hand-plots onto (with the answer key drawn in the showAnswers variant).
   Keep the screen rule's square aspect (the grid defines the plotting area)
   and cap it at a hand-plottable paper size; the "needs JavaScript" cue is
   hidden above. Answer checking is on-screen only. */
  .graph-canvas {
    max-width: 3.5in;
  }

  /* Number line on paper: the static fallback SVG (number-line-svg.ts) prints —
   a real number line the student hand-marks (answer key drawn in the
   showAnswers variant). Cap at a hand-markable width; the "needs JavaScript"
   cue is hidden above. Answer checking is on-screen only. */
  .number-line-canvas {
    max-width: 5in;
  }

  /* Don't establish an inline-flex formatting context in print — let the
   i npu*t flow naturally as plain inline content. Equivalent in this single-
   visible-child case to inline-flex, but explicit avoids relying on print
   engines treating one-item flex identically to bare-inline. */
  .blank-wrapper {
    display: inline;
  }

  /* Page-break integrity. Modern break-* names; legacy page-break-* aliases
   omit*ted (RUNTIME.md support matrix is Chrome/Firefox/Safari/Edge).
   Problem spacing and per-problem work space are configured here:
   --print-problem-spacing sets the vertical gap between problems;
   --print-work-space pads blank working room below each problem (a
   fill-in-blank block may override it per-problem with its own inline
   --print-work-space). break-inside: avoid keeps a problem (and its work
   space) whole across page and column breaks. */
  .block-problem,
  .block-fill-in-blank,
  .block-interactive-graph,
  .block-number-line,
  .block-multiple-choice,
  .block-matching,
  .block-ordering {
    break-inside: avoid;
    margin-top: var(--print-problem-spacing, 1.25rem);
    margin-bottom: var(--print-problem-spacing, 1.25rem);
    padding-bottom: var(--print-work-space, 0);
  }

  /* Multiple choice on paper: hide the native radio/checkbox controls — the
   choice letters are the circle-me markers. The answer-key variant marks
   correct choices with a drawn ring around the letter. Post-check state
   classes and revealed feedback are neutralized (a printed worksheet is the
   blank version). */
  .mc-choice input { display: none; }
  .mc-choice,
  .mc-choice.correct,
  .mc-choice.incorrect {
    background: transparent;
  }
  .mc-choice-feedback { display: none; }
  .mc-choice-letter { color: black; }
  .mc-key-correct .mc-choice-letter {
    outline: 1.5px solid black;
    outline-offset: 2px;
    border-radius: 50%;
  }

  /* Matching on paper: the century-old convention — a lettered bank on the
   right, a write-the-letter line on each item. The interactive dock (and any
   ghost letters) disappear; verdict backgrounds are neutralized (a printed
   worksheet is the blank version). The answer-key variant fills the line. */
  .match-slot,
  .match-slot-ghost,
  .match-target-slot.is-empty .match-slot-ghost {
    display: none;
  }
  .match-letter-line {
    display: inline-block;
    min-width: 2.5rem;
    border-bottom: 1px solid black;
    text-align: center;
    font-weight: 600;
    align-self: baseline;
  }
  .match-item,
  .match-item.correct,
  .match-item.incorrect {
    background: transparent;
  }
  .match-target { border-color: black; cursor: default; }
  .match-target-letter { color: black; }

  /* Ordering on paper: "number the steps 1–N" — a write-in box per row, grip
   glyphs hidden, verdict styling neutralized. The answer-key variant fills
   each box with the item's correct position. */
  .order-item-grip { display: none; }
  .order-number-box {
    display: inline-block;
    min-width: 1.6rem;
    min-height: 1.4rem;
    border: 1px solid black;
    border-radius: 4px;
    text-align: center;
    font-weight: 600;
  }
  .order-item,
  .order-item.correct,
  .order-item.incorrect {
    background: transparent;
    border-color: black;
    cursor: default;
  }
  .activity-section {
    break-before: auto; /* explicit: flow naturally, don't force a page */
  }
  .activity-header h1,
  .section-title,
  .block-heading-1,
  .block-heading-2,
  .block-heading-3 {
    break-after: avoid; /* don't strand a heading at a page bottom */
  }

  /* Blanks print as underlined fill-ins. Correct/incorrect state classes
   a re *neutralized — a printed worksheet is the BLANK version a teacher
   hands out before the lesson, so there is no scored state to convey. */
  .blank,
  .blank.correct,
  .blank.incorrect {
    background: transparent;
    border-top: none;
    border-left: none;
    border-right: none;
    border-bottom: 1px solid black;
  }

  /* Callouts: solid borders carry color on screen; in B&W the variants
   b eco*me indistinguishable. Encode the variant in border STYLE so an
   info callout looks different from a warning even in grayscale. The
   icons remain (they survive grayscale too — belt and suspenders). */
  .block-callout-info    { border-left-style: solid;  }
  .block-callout-warning { border-left-style: dashed; }
  .block-callout-success { border-left-style: double; }
  .block-callout-note    { border-left-style: dotted; }

  /* Content scaffolds print as plain bordered boxes (colour carries no meaning
     in B&W; the border + label do). Keep them whole on the page. The faded
     example keeps a DASHED border so it stays visually distinct from the solid
     worked-example box in grayscale. */
  .block-learning-objectives,
  .block-worked-example {
    background: transparent;
    border: 1px solid black;
    break-inside: avoid;
  }
  .block-faded-example {
    background: transparent;
    border: 1px dashed black;
    break-inside: avoid;
  }
  .block-worked-example__title,
  .block-faded-example__title { color: black; }

  /* Free-text blocks print as a blank writing area (a bordered box with room to
     write by hand); on-screen focus styling is dropped. The essay word counter
     is a screen-only affordance. */
  .free-text-input {
    border: 1px solid black;
    background: transparent;
    min-height: 4.5rem;
    resize: none;
    break-inside: avoid;
  }
  .free-text-wordcount { display: none; }
  /* Feedback is an online-only affordance — a printed worksheet has none. */
  .free-text-feedback { display: none; }
