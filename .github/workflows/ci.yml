name: CI

# Run on PRs (any base) and on direct pushes to main. Limiting push to main
# avoids the double-run where a feature-branch push and its open PR both fire
# CI on the same commits; feature branches get covered by the PR run, and
# merges/direct commits to main still get a run.
on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger for generating the print baselines on Linux, which is the
  # only platform whose images are authoritative (S5-7). Run it, download the
  # artifact, commit the .png files.
  workflow_dispatch:
    inputs:
      update_print_baselines:
        description: 'Generate print screenshot baselines (download + commit the artifact)'
        type: boolean
        default: false

jobs:
  check:
    name: typecheck · lint · test · build · bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup reads the version from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Regenerate the committed renderer/runtime bundle and fail if it drifts
      # from what's checked in — deploys must never ship a stale bundle.
      # (CLAUDE.md: "Renderer bundle commits with the source it supports.")
      - name: Renderer bundle is up to date
        run: |
          pnpm bundle:renderer
          git diff --exit-code -- \
            packages/renderer/src/runtime/generated/runtime-bundle.ts \
            packages/renderer/src/runtime/generated/runtime-graphs-bundle.ts \
            packages/renderer/src/generated/katex-css.ts \
            supabase/functions/_shared/renderer.bundle.js \
          || {
            echo "::error::Committed renderer bundle is stale. Run 'pnpm bundle:renderer' and commit the result.";
            exit 1;
          }

      # Same discipline for the read-API server bundle (S2): regenerate and
      # fail if the committed file drifts from schema/viewer sanitize source.
      - name: Viewer server bundle is up to date
        run: |
          pnpm bundle:viewer-server
          git diff --exit-code -- \
            supabase/functions/_shared/viewer-server.bundle.js \
          || {
            echo "::error::Committed viewer server bundle is stale. Run 'pnpm bundle:viewer-server' and commit the result.";
            exit 1;
          }

      # And for the grading bundle (S4). This step also enforces the bundle's
      # SIZE CEILING, which is not cosmetic: importing the graph scorers through
      # the graph-kit barrel instead of its pure `/scorers` entry once pulled
      # 1 MB of MathLive into this function — the server needs no LaTeX at all
      # (the graded form is already ascii). The bundle script exits non-zero
      # over the ceiling, so that regression fails the build rather than
      # quietly tripling a student's cold start.
      - name: Grading server bundle is up to date
        run: |
          pnpm bundle:grading-server
          git diff --exit-code -- \
            supabase/functions/_shared/grading-server.bundle.js \
          || {
            echo "::error::Committed grading server bundle is stale. Run 'pnpm bundle:grading-server' and commit the result.";
            exit 1;
          }

  # ---------------------------------------------------------------------------
  # The print gates. Built in S5 as the renderer-RETIREMENT gate (one of the two
  # that let the string renderer leave the student path); since S5.5 proved the
  # port and the contact sheet was signed off, they are the STANDING print gates
  # for the viewer. They run where PRs merge — a gate that only runs when
  # someone remembers to run it is not a gate.
  #
  # Their own job rather than a step in `check`: they need a browser and a dev
  # server, which the fast typecheck/lint/test job should not wait for, and a
  # browser-shaped failure should read as "print broke" rather than as a mystery
  # inside a job called `test`.
  #
  # Scoped to the print suites deliberately. The editor's 145-case e2e suite is
  # still local-only; bringing it into CI is a separate decision with its own
  # runtime cost, and quietly folding it in here would make this job's failures
  # ambiguous.
  # ---------------------------------------------------------------------------
  print-gates:
    name: print gates (rules · pagination · answer key · baselines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium only — the gate asserts CSS the print engine applies, not
      # cross-browser behaviour, and every extra browser is install time on
      # every run.
      - name: Install Chromium
        run: pnpm --filter @activity/app exec playwright install --with-deps chromium

      # Every print suite, matched by prefix: the rules gate (print-rules), the
      # paginated layer it cannot reach (print-pagination), the answer-key gate
      # (print-answer-key), and the screenshot baselines. All are viewer-only:
      # the cross-surface halves that compared against the retiring renderer
      # retired once the port was proven and the contact sheet signed off
      # (S5-abs).
      #
      # PRINT_BASELINES=1 turns the baseline suite ON here, in COMPARE mode —
      # note there is no --update-snapshots, which is what separates this from
      # the generation job below. Without the flag the suite skips itself and
      # the committed images sit inert, which is what they did until now.
      # It belongs on Linux only: macOS font rasterisation differs enough to
      # fail against Linux-authored images for no reason a human would call a
      # defect (S5-7), so local `playwright test print-` still skips them.
      - name: Print gates
        env:
          PRINT_BASELINES: '1'
        run: pnpm --filter @activity/app exec playwright test print-

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: print-gate-traces
          path: packages/app/test-results/
          retention-days: 7

  # Generates the Linux print baselines on demand. Not part of the normal run:
  # a job that rewrites its own expectations on every push would make the
  # baselines meaningless. The images come back as an artifact for a human to
  # inspect and commit — CI never commits its own snapshots.
  print-baselines:
    name: generate print baselines (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.update_print_baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @activity/app exec playwright install --with-deps chromium

      - name: Generate baselines
        env:
          PRINT_BASELINES: '1'
        run: pnpm --filter @activity/app exec playwright test print-baselines --update-snapshots

      - name: Upload baselines
        uses: actions/upload-artifact@v4
        with:
          name: print-baselines
          path: packages/app/e2e/**/*.png
          retention-days: 14
