name: CI

# Run on PRs (any base) and on direct pushes to main. Limiting push to main
# avoids the double-run where a feature-branch push and its open PR both fire
# CI on the same commits; feature branches get covered by the PR run, and
# merges/direct commits to main still get a run.
on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger for generating the print baselines on Linux, which is the
  # only platform whose images are authoritative (S5-7). Run it, download the
  # artifact, commit the .png files.
  workflow_dispatch:
    inputs:
      update_print_baselines:
        description: 'Generate print screenshot baselines (download + commit the artifact)'
        type: boolean
        default: false

jobs:
  check:
    name: typecheck · lint · test · build · bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup reads the version from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # The Supabase env is BAKED IN at build time (vite inlines import.meta.env),
      # and this dist is what the perf job downloads and serves. The sw and
      # student-path specs fake a session under the storage key supabase-js
      # derives from this URL — an env-less build derives no key at all, so
      # every signed-in spec lands on the sign-in screen and times out. These
      # are the same pinned values playwright.config.ts gives the local preview
      # build; they are e2e-only and this artifact is never deployed.
      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: e2e-anon-key

      # The S8 size gates. Deterministic by construction — the same commit
      # produces the same bytes everywhere — so a red here is always a real
      # regression, never runner variance. That is why the millisecond
      # measurements live in the perf job instead of this one (ruling D3).
      #
      # Guards: the student shell (entry chunk JS and CSS, separately), the
      # shell's purity (no KaTeX/MathLive/JSXGraph/ProseMirror code in the entry
      # chunk — the enforcement of ruling D16), the heavy-chunk ledger, and the
      # service-worker precache (count + bytes, ruling D19). Numbers and their
      # reasoning: scripts/perf-budgets.mjs.
      - name: Performance budgets
        run: node scripts/check-perf-budget.mjs

      # Unit tests for the budget machinery itself, including the pin that the
      # three Edge Function ceilings still hold their pre-migration values
      # (ruling D8) and the fixture cases that fire every failure path. A gate
      # whose red branches have never run is a gate nobody has tested — and the
      # vacuity cases are unreachable against a healthy build by definition.
      - name: Budget script tests
        run: node --test scripts/tests/*.test.mjs

      # The perf job serves THIS dist rather than rebuilding, so the lane
      # measures the exact artifact the budgets above just passed.
      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: packages/app/dist
          retention-days: 1

      # (The renderer-bundle drift step died at S9 Drop 4 with the renderer
      # package — published pages no longer exist. The two surviving bundle
      # disciplines are below.)

      # Same discipline for the read-API server bundle (S2): regenerate and
      # fail if the committed file drifts from schema/viewer sanitize source.
      - name: Viewer server bundle is up to date
        run: |
          pnpm bundle:viewer-server
          git diff --exit-code -- \
            supabase/functions/_shared/viewer-server.bundle.js \
          || {
            echo "::error::Committed viewer server bundle is stale. Run 'pnpm bundle:viewer-server' and commit the result.";
            exit 1;
          }

      # And for the grading bundle (S4). This step also enforces the bundle's
      # SIZE CEILING, which is not cosmetic: importing the graph scorers through
      # the graph-kit barrel instead of its pure `/scorers` entry once pulled
      # 1 MB of MathLive into this function — the server needs no LaTeX at all
      # (the graded form is already ascii). The bundle script exits non-zero
      # over the ceiling, so that regression fails the build rather than
      # quietly tripling a student's cold start.
      - name: Grading server bundle is up to date
        run: |
          pnpm bundle:grading-server
          git diff --exit-code -- \
            supabase/functions/_shared/grading-server.bundle.js \
          || {
            echo "::error::Committed grading server bundle is stale. Run 'pnpm bundle:grading-server' and commit the result.";
            exit 1;
          }

  # ---------------------------------------------------------------------------
  # The print gates. Built in S5 as the renderer-RETIREMENT gate (one of the two
  # that let the string renderer leave the student path); since S5.5 proved the
  # port and the contact sheet was signed off, they are the STANDING print gates
  # for the viewer. They run where PRs merge — a gate that only runs when
  # someone remembers to run it is not a gate.
  #
  # Their own job rather than a step in `check`: they need a browser and a dev
  # server, which the fast typecheck/lint/test job should not wait for, and a
  # browser-shaped failure should read as "print broke" rather than as a mystery
  # inside a job called `test`.
  #
  # Scoped to the print suites deliberately. The editor's 145-case e2e suite is
  # still local-only; bringing it into CI is a separate decision with its own
  # runtime cost, and quietly folding it in here would make this job's failures
  # ambiguous.
  # ---------------------------------------------------------------------------
  print-gates:
    name: print gates (rules · pagination · answer key · baselines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium only — the gate asserts CSS the print engine applies, not
      # cross-browser behaviour, and every extra browser is install time on
      # every run.
      - name: Install Chromium
        run: pnpm --filter @activity/app exec playwright install --with-deps chromium

      # Every print suite, matched by prefix: the rules gate (print-rules), the
      # paginated layer it cannot reach (print-pagination), the answer-key gate
      # (print-answer-key), and the screenshot baselines. All are viewer-only:
      # the cross-surface halves that compared against the retiring renderer
      # retired once the port was proven and the contact sheet signed off
      # (S5-abs).
      #
      # PRINT_BASELINES=1 turns the baseline suite ON here, in COMPARE mode —
      # note there is no --update-snapshots, which is what separates this from
      # the generation job below. Without the flag the suite skips itself and
      # the committed images sit inert, which is what they did until now.
      # It belongs on Linux only: macOS font rasterisation differs enough to
      # fail against Linux-authored images for no reason a human would call a
      # defect (S5-7), so local `playwright test print-` still skips them.
      - name: Print gates
        env:
          PRINT_BASELINES: '1'
        run: pnpm --filter @activity/app exec playwright test print-

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: print-gate-traces
          path: packages/app/test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The S8 perf lane, plus the two browser lanes that were local-only until now.
  #
  # WHY THESE THREE RUN TOGETHER. They all need the same thing: the production
  # build served by `vite preview`. The perf lane measures it, the sw lane
  # exercises the worker that only exists in it, and the student lane drives the
  # signed-in viewer. Sharing one job means one download and one browser
  # install.
  #
  # WHY THE SW AND STUDENT LANES ARE HERE AT ALL (ruling D11). They were
  # local-only, which made "these lanes must stay green" an aspiration rather
  # than a gate — nothing ran them. Route-splitting is precisely the change most
  # likely to break the service worker's stale-chunk recovery path, and that
  # path's only test lived in the lane CI never ran. Bringing them in was part
  # of the same slice that created the risk.
  #
  # The editor's 145-case suite deliberately stays out; folding it in is its own
  # decision with its own runtime cost, unchanged by this job.
  # ---------------------------------------------------------------------------
  perf-gates:
    name: perf budget lane (throttled timing · route mount · sw · student)
    needs: check
    runs-on: ubuntu-latest
    # Typical end-to-end: ~6-8 min (install + chromium + 35 specs at ~2.6 min).
    # Without a bound, a hung preview server burns free-tier minutes silently
    # until GitHub's 6-HOUR default kills it (eng-review D22, 2026-08-06).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @activity/app exec playwright install --with-deps chromium

      # Reuse the artifact `check` already built and already measured, instead
      # of a third full build per PR.
      - name: Download built app
        uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: packages/app/dist

      - name: Perf, service-worker and student lanes
        env:
          # Serve the downloaded dist; do not rebuild (see playwright.config.ts).
          E2E_SKIP_BUILD: '1'
        run: |
          pnpm --filter @activity/app exec playwright test \
            --project=perf --project=sw --project=student

      # The timing artifact. Recorded every run whether or not anything failed:
      # the numbers are the input to the calibration baseline and to the open
      # KaTeX decision (T7), and a measurement you only keep on success is a
      # measurement you cannot learn from.
      - name: Upload timing measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-measurements
          path: packages/app/perf-results/
          retention-days: 30

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-traces
          path: packages/app/test-results/
          retention-days: 7

  # Generates the Linux print baselines on demand. Not part of the normal run:
  # a job that rewrites its own expectations on every push would make the
  # baselines meaningless. The images come back as an artifact for a human to
  # inspect and commit — CI never commits its own snapshots.
  print-baselines:
    name: generate print baselines (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.update_print_baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @activity/app exec playwright install --with-deps chromium

      - name: Generate baselines
        env:
          PRINT_BASELINES: '1'
        run: pnpm --filter @activity/app exec playwright test print-baselines --update-snapshots

      - name: Upload baselines
        uses: actions/upload-artifact@v4
        with:
          name: print-baselines
          path: packages/app/e2e/**/*.png
          retention-days: 14
